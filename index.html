<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile-first viewport: prevent user zoom, fill safe area on notched phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA / Mobile App experience -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IQOS Audit Management" />
    <meta name="theme-color" content="#0f172a" />

    <title>IQOS Audit Management</title>
    <meta name="description" content="Sistema profesional de auditoría hotelera. Inspección de habitaciones, minibar, limpieza y amenidades." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { height: 100%; }
      body { height: 100%; height: 100dvh; overflow: hidden; background: #0f172a; }
      #root {
        /* dvh = dynamic viewport height: adjusts when browser chrome (address/nav bar) is shown/hidden */
        height: 100vh;
        height: 100dvh;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      /* Safe area insets for notched iPhones & Android nav bar */
      body { padding-top: env(safe-area-inset-top); }
      /* Smooth scrolling & momentum on iOS */
      * { -webkit-overflow-scrolling: touch; -webkit-tap-highlight-color: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
